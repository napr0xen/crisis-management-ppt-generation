# Stateful, non-ML services only (ADR-001). The FastAPI backend and Ollama run natively.
name: doc-intel

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG}
    environment:
      # empty = no auth; set QDRANT_API_KEY in .env so only the backend can read the vectors
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g
    healthcheck:
      # The image ships without curl/wget, so probe /readyz over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_IMAGE_TAG}
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # Our backend does retrieval; Open WebUI must not inject its own RAG context (ADR-002).
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui_data:/app/backend/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  openwebui_data:
