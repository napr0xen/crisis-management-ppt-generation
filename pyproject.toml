[project]
name = "doc-intel"
version = "0.1.0"
description = "Local-first Document Intelligence & Template Mapping Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "docling[rapidocr]>=2.150.1",
    "fastapi>=0.164.0",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_intel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the Docker Compose stack (Postgres, Qdrant)",
  "llm: needs Ollama and models",
  "eval: RAG/mapping evaluation",
  "slow: slow tests",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "ruff>=0.17.5",
]
